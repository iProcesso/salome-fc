const Sessao = {
  token()      { try { return localStorage.getItem('fc_token') || ''; } catch (e) { return ''; } },
  set(t)       { try { localStorage.setItem('fc_token', t); } catch (e) {} },
  limpar()     { try { localStorage.removeItem('fc_token'); } catch (e) {} }
};

function api(acao, payload = {}) {
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' || !google.script) {
      return reject({ codigo: 'OFFLINE', mensagem: 'Rodando fora do Apps Script (modo protótipo).' });
    }
    google.script.run
      .withSuccessHandler(r => r.ok ? resolve(r.dados) : reject(r))
      .withFailureHandler(e => reject({ codigo: 'ERRO_SERVIDOR', mensagem: String(e && e.message || e) }))
      .api(acao, payload, Sessao.token());
  });
}

let VIEW='inicio';
function renderMenu(){
  const el=document.getElementById('menu'); let h='';
  MENU.forEach(gr=>{
    const vis=gr.itens.filter(it=>sees(it.k));
    if(!vis.length)return;
    if(gr.g)h+=`<div class="grp">${gr.g}</div>`;
    vis.forEach(it=>{
      const b=it.badge?it.badge():0;
      h+=`<button class="nav ${VIEW===it.k?'on':''}" onclick="go('${it.k}')" title="${it.t}">
            ${svg(it.i)}<span class="lb">${it.t}</span>${b?`<span class="bdg">${b}</span>`:''}</button>`;
    });
  });
  el.innerHTML=h;
}

const PC_MAP={'3.01.003':['Custo Operacional - Frota','Custo','Sim',7],'3.01.001':['Custo Operacional - Frota','Custo','Sim',1],
 '3.03.004':['Despesa Administrativa','Despesa','Sim',7],'3.05.001':['Investimento (CAPEX)','Investimento','Sim',10]};
const ALC=[[2000,'Alçada 1 · Supervisão','Supervisor Administrativo'],[10000,'Alçada 2 · Gerência','Gerente Adm./Financeiro'],
 [50000,'Alçada 3 · Diretoria Financeira','Diretor Financeiro'],[9e9,'Alçada 4 · Diretoria','Diretor Financeiro + CEO']];
function calc(){
  const cod=document.getElementById('fCod').value, pc=PC_MAP[cod];
  document.getElementById('fGrp').value=pc[0];
  document.getElementById('fNat').value=pc[1];
  document.getElementById('fRat').value=pc[2];
  document.getElementById('fAntM').value=pc[3]+' dias';
  const dt=new Date(document.getElementById('fDt').value+'T00:00:00'), hoje=new Date('2026-09-21T00:00:00');
  const dias=Math.round((dt-hoje)/864e5);
  document.getElementById('fAntP').value=dias+' dias';
  const val=Number(document.getElementById('fVal').value||0);
  const a=ALC.find(x=>val<=x[0]);
  document.getElementById('fAlc').value=a[1]; document.getElementById('fApr').value=a[2];
  let wi=-1; for(let i=WDATE.length-1;i>=0;i--){const [d,m]=WDATE[i].split('/');const wd=new Date(2026,+m-1,+d);if(wd<=dt){wi=i;break}}
  const saldo=wi>=0?FLOW.saldoAcu[wi]:null;
  document.getElementById('fSem').value=wi>=0?WEEKS[wi]+' · '+WDATE[wi]:'fora do horizonte';
  document.getElementById('fSaldo').value=saldo!==null?'R$ '+m0(saldo):'—';
  let k,t,d;
  if(saldo===null){k='wa';t='SEM PROJEÇÃO DE CAIXA';d='A data está fora das 12 semanas do fluxo.';}
  else if(saldo<0){k='cr';t='REPROGRAMAR';d='A semana fecha com caixa negativo.';}
  else if(saldo<150000){k='wa';t='AVALIAR NA REUNIÃO';d='Saldo abaixo do mínimo de segurança (R$ 150.000).';}
  else if(dias<pc[3]){k='wa';t='AVALIAR — fora do prazo';d=`A classificação exige ${pc[3]} dias de antecedência; foram pedidos ${dias}.`;}
  else {k='ok';t='LIBERAR';d='Há caixa na semana e a regra de antecedência foi cumprida.';}
  document.getElementById('fVerdict').innerHTML=`<div class="verdict ${k}">
    <div style="flex:none">${svg(k==='ok'?I.check:'M12 8v5M12 16.5h.01M10.3 3.9 2.4 17.4A1.9 1.9 0 0 0 4 20.3h16a1.9 1.9 0 0 0 1.6-2.9L13.7 3.9a1.9 1.9 0 0 0-3.4 0z')}</div>
    <div><b>${t}</b><p>${d}</p></div></div>`;
}

const STEPS=['Solicitar','Validar regra','Consultar caixa','Aprovar','Autorizar','Receber NF','Pagar'];
function stepIdx(st){return {'Aguardando Aprovação':3,'Reprogramado':3,'Aprovado':4,'Comprometido':5,'Pago':7}[st]??3}
function openSol(id){
  const s=SOL.find(x=>x.id===id); if(!s)return;
  const cur=stepIdx(s.st), blk=s.st==='Reprogramado';
  const steps=STEPS.map((t,i)=>{
    const cls=i<cur?'done':(i===cur?(blk?'blk':'now'):'');
    const ic=i<cur?'✓':(i===cur&&blk?'!':i+1);
    return `<div class="step ${cls}" role="button" onclick="toast('Etapa: ${t}')"><span class="ic">${ic}</span>${t}</div>`;
  }).join('');
  const ok=podeAprovar(s.val);
  const acoes=['Aguardando Aprovação','Reprogramado'].includes(s.st)
    ? (ok?`<div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn ok" onclick="decide('${s.id}','Aprovada')">${svg(I.check)}Aprovar</button>
        <button class="btn wa" onclick="decide('${s.id}','Reprogramada')">Reprogramar</button>
        <button class="btn cr" onclick="decide('${s.id}','Reprovada')">Reprovar</button></div>`
      :`<div class="note" style="margin-top:14px">Valor de R$ ${money(s.val)} exige <b>${s.alc}</b>. Seu perfil não tem essa alçada.</div>`)
    : '';
  const body=`
  <div class="steps">${steps}</div>
  <div class="verdict ${RECMAP[s.rec]==='mu'?'ok':RECMAP[s.rec]}" style="margin-bottom:16px">
    <div style="flex:none">${svg(s.rec==='LIBERAR'?I.check:'M12 8v5M12 16.5h.01M10.3 3.9 2.4 17.4A1.9 1.9 0 0 0 4 20.3h16a1.9 1.9 0 0 0 1.6-2.9L13.7 3.9a1.9 1.9 0 0 0-3.4 0z')}</div>
    <div><b>${s.rec==='—'?'Sem pendência de decisão':s.rec}</b>
    <p>Semana ${s.sem} · saldo projetado R$ ${m0(s.saldo)}${s.obs?' · '+s.obs:''}</p></div></div>
  <div class="tabs">
    <button class="tab on" onclick="drTab(this,0)">Dados</button>
    <button class="tab" onclick="drTab(this,1)">Rateio</button>
    <button class="tab" onclick="drTab(this,2)">Anexos</button>
    <button class="tab" onclick="drTab(this,3)">Histórico</button></div>

      <dt>Alçada requerida</dt><dd>${s.alc}</dd>

  <div id="drt1" hidden>

      ${[['RP',45],['CPQ',20],['OSA',20],['SPO',15]].map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]},0%</td>
      <td class="n">${money(s.val*r[1]/100)}</td></tr>`).join('')}

  <div id="drt2" hidden>

      <div class="r"><button class="btn sm">Abrir pasta</button></div></div></div>
  <div id="drt3" hidden>
    <ul class="tl">
      <li><time>21/09 08:47</time><div><b>Consulta de caixa</b> <span>— saldo da semana ${s.sem} recalculado: R$ ${m0(s.saldo)}</span></div></li>
      <li><time>${s.dt} 16:41</time><div><b>Solicitação criada</b> <span>por ${s.sol} · origem WEB</span></div></li>
      <li><time>${s.dt} 16:41</time><div><b>Regra aplicada</b> <span>— antecedência mínima da classificação ${s.cod}</span></div></li>
      ${s.st==='Reprogramado'?`<li><time>09/09 09:12</time><div><b>Reprogramada</b> <span>por Carlos Salomé — sem caixa na data pedida</span></div></li>`:''}
      ${s.st==='Comprometido'?`<li><time>16/09 08:12</time><div><b>NF recebida</b> <span>— valor alterado de R$ ${money(s.val)} para R$ ${money(s.val+400)}</span></div></li>`:''}
    </ul>
    <div class="note" style="margin-top:14px">Este histórico é a leitura da aba <span class="mono">LOG_ATIV</span> filtrada por este registro.</div></div>`;
  openDrawer(s.id,`${s.forn} · R$ ${money(s.val)} · previsto para ${s.prev}`,body);
}
function drTab(btn,i){
  [...btn.parentElement.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  for(let j=0;j<4;j++){const e=document.getElementById('drt'+j);if(e)e.hidden=(j!==i)}
}

let mSel=new Set();
function openPhone(){
  document.getElementById('mPend').textContent=PEND.length;
  document.getElementById('mVal').textContent='R$ '+m0(PEND.reduce((a,s)=>a+s.val,0));
  document.getElementById('mCx').textContent='R$ 108k';
  document.getElementById('phBody').innerHTML=PEND.map(s=>{
    const k=RECMAP[s.rec], ok=podeAprovar(s.val);
    return `<div class="mc">
      <div class="r"><span class="who2">${s.forn}</span><span class="vl">${m0(s.val)}</span></div>
      <div class="ln">${s.cls} · ${s.sol}</div>
      <div class="ln">Prev. ${s.prev} · semana ${s.sem} · saldo R$ ${m0(s.saldo)}</div>
      <div class="why v-${k}">
        ${svg(s.rec==='LIBERAR'?I.check:'M12 8v5M12 16.5h.01M10.3 3.9 2.4 17.4A1.9 1.9 0 0 0 4 20.3h16a1.9 1.9 0 0 0 1.6-2.9L13.7 3.9a1.9 1.9 0 0 0-3.4 0z')}
${s.rec}${s.ant!=='OK'?' · fora do prazo':''}</div>
      ${ok?`<div class="bt">
        <button style="border-color:var(--crit);color:var(--crit);background:var(--crit-soft)" onclick="mAct('${s.id}','Reprogramada')">Reprogramar</button>
        <button style="border-color:var(--ok);color:var(--ok);background:var(--ok-soft)" onclick="mAct('${s.id}','Aprovada')">Aprovar</button>
      </div>`:`<div class="ln" style="margin-top:9px;color:var(--crit)">Acima da sua alçada — ${s.alc}</div>`}

   ============================================================ */
function openLogin(){document.getElementById('loginWrap').classList.add('on')}
function closeLogin(){document.getElementById('loginWrap').classList.remove('on')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),3400)}
document.getElementById('colBtn').onclick=()=>{
  const r=document.getElementById('rail'); r.classList.toggle('min');
  document.getElementById('colIcon').innerHTML=`<path d="${r.classList.contains('min')?'M9 6l6 6-6 6':'M15 6l-6 6 6 6'}"/>`;
};
document.getElementById('mobBtn').onclick=()=>document.getElementById('rail').classList.toggle('mob');
document.getElementById('drClose').onclick=closeDrawer;
document.getElementById('scrim').onclick=closeDrawer;
document.getElementById('phoneX').onclick=()=>document.getElementById('phoneWrap').classList.remove('on');
document.getElementById('roleSel').onchange=e=>{
  ROLE=e.target.value;
  document.getElementById('uname').textContent=USERS[ROLE][0];
  document.getElementById('avatar').textContent=USERS[ROLE][1];
  if(!sees(VIEW))VIEW='inicio';
  renderMenu();render();
  toast('Perfil: '+e.target.selectedOptions[0].text+' — menu, botões e alçadas recalculados.');
};
document.getElementById('themeBtn').onclick=()=>{
  const r=document.documentElement;
  const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  r.setAttribute('data-theme',cur==='dark'?'light':'dark');
};
addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDrawer();closeLogin();document.getElementById('phoneWrap').classList.remove('on')}
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.getElementById('gsearch').focus()}
});
document.getElementById('gsearch').oninput=e=>{
  const q=e.target.value.trim().toLowerCase(); if(q.length<2)return;
  const hit=SOL.find(s=>s.id.toLowerCase().includes(q)||s.forn.toLowerCase().includes(q)||String(s.val).includes(q));
  if(hit&&q.length>3){toast('Encontrado: '+hit.id+' — Enter para abrir');
    document.getElementById('gsearch').onkeydown=k=>{if(k.key==='Enter')openSol(hit.id)}}
};
function fitMob(){document.getElementById('mobBtn').style.display=innerWidth<=860?'grid':'none'}
addEventListener('resize',fitMob);fitMob();
renderMenu();render();
</script>
