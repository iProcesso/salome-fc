<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FC Salomé · Apontamento Financeiro de Compras</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #EEF1F5; color: #141C26;
  }
  main {
    background: #FFFFFF; border: 1px solid #D8DEE7; border-radius: 10px;
    padding: 28px 24px; width: min(380px, calc(100vw - 32px)); text-align: center;
    box-shadow: 0 4px 16px -6px rgba(20,28,38,.22);
  }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { font-size: 14px; color: #48566A; margin: 0 0 20px; line-height: 1.5; }
  a.btn {
    display: block; background: #015180; color: #FFFFFF; text-decoration: none;
    border-radius: 6px; padding: 11px 14px; font-weight: 600; font-size: 15px;
  }
  a.btn:hover { filter: brightness(1.08); }
  small { display: block; margin-top: 16px; color: #7A8798; font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    body { background: #0C1219; color: #E8EDF3; }
    main { background: #141C26; border-color: #28323F; }
    p { color: #AFBBC9; }
    small { color: #7E8C9C; }
  }
</style>
</head>
<body>
<main>
  <h1>FC Salomé · Apontamento Financeiro de Compras</h1>
  <p>Para entrar, use o botão abaixo. O sistema abre pelo servidor, com seu usuário e senha.</p>

</main>
