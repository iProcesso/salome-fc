<!-- css.html — incluído por include('src/web/css') -->
<style>
:root{
  --paper:#EEF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --surface-3:#E7ECF2;
  --ink:#141C26; --ink-2:#48566A; --ink-3:#7A8798;
  --line:#D8DEE7; --line-2:#C2CAD6;
  --navy:#1F3864; --navy-2:#2E5C9A; --navy-soft:#E3EAF5;
  --ok:#1F6B4C; --ok-soft:#DEEFE6; --warn:#8F5B0C; --warn-soft:#F7EAD4;
  --crit:#96311F; --crit-soft:#F7E0DB; --info:#1F5F7A; --info-soft:#DDEEF4;
  --sh-1:0 1px 2px rgba(20,28,38,.07); --sh-2:0 4px 16px -6px rgba(20,28,38,.22);
  --sh-3:0 18px 48px -18px rgba(20,28,38,.42);
  --rail:248px; --rail-min:60px; --top:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C1219; --surface:#141C26; --surface-2:#1A2431; --surface-3:#22303F;
  --ink:#E8EDF3; --ink-2:#AFBBC9; --ink-3:#7E8C9C;
  --line:#28323F; --line-2:#3A4757;
  --navy:#87ACE0; --navy-2:#9CBEEC; --navy-soft:#1A2637;
  --ok:#6FBE97; --ok-soft:#152720; --warn:#D9A85E; --warn-soft:#2A2013;
  --crit:#E08C7F; --crit-soft:#2C1714; --info:#77B6CE; --info-soft:#13252C;
  --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 4px 16px -6px rgba(0,0,0,.7);
  --sh-3:0 18px 48px -18px rgba(0,0,0,.85);
}}
:root[data-theme="dark"]{
  --paper:#0C1219; --surface:#141C26; --surface-2:#1A2431; --surface-3:#22303F;
  --ink:#E8EDF3; --ink-2:#AFBBC9; --ink-3:#7E8C9C;
  --line:#28323F; --line-2:#3A4757;
  --navy:#87ACE0; --navy-2:#9CBEEC; --navy-soft:#1A2637;
  --ok:#6FBE97; --ok-soft:#152720; --warn:#D9A85E; --warn-soft:#2A2013;
  --crit:#E08C7F; --crit-soft:#2C1714; --info:#77B6CE; --info-soft:#13252C;
  --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 4px 16px -6px rgba(0,0,0,.7);
  --sh-3:0 18px 48px -18px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--navy-2);outline-offset:2px;border-radius:3px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:3px solid var(--paper)}

/* ============ NOTE BAR ============ */
.protobar{background:var(--navy);color:var(--surface);padding:7px 18px;font-size:12px;display:flex;
  gap:14px;align-items:center;flex-wrap:wrap}
.protobar b{font-weight:600}
.protobar span{opacity:.82}


/* ============ TOPBAR ============ */
.topbar{height:var(--top);background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 14px 0 10px;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo-sal{display:flex;align-items:center;gap:7px}
.logo-mark{width:26px;height:26px;border-radius:5px;background:var(--navy);display:grid;place-items:center;
  color:var(--surface);font-weight:700;font-size:12px;letter-spacing:-.03em;flex:none}

.logo-txt{font-weight:700;letter-spacing:.02em;font-size:15px}
.logo-div{width:1px;height:22px;background:var(--line)}
.logo-ip{font-size:10.5px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;line-height:1.15}
.logo-ip b{display:block;color:var(--ink-2);font-size:11.5px;letter-spacing:.02em;text-transform:none}
.ph{font-size:9px;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:3px;padding:1px 4px;margin-left:4px}
.appname{font-size:12px;color:var(--ink-3);border-left:1px solid var(--line);padding-left:14px;margin-left:2px}
.appname b{color:var(--ink);font-size:13px;font-weight:600}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:6px;padding:6px 10px;width:280px;color:var(--ink-3);font-size:13px}
.search input{border:0;background:transparent;outline:none;color:var(--ink);width:100%;font:inherit}
.search kbd{font-family:"IBM Plex Mono",monospace;font-size:10px;border:1px solid var(--line-2);
  border-radius:3px;padding:1px 4px;color:var(--ink-3)}
.tb-btn{background:transparent;border:1px solid transparent;border-radius:6px;padding:6px;display:grid;place-items:center;color:var(--ink-2)}
.tb-btn:hover{background:var(--surface-2);border-color:var(--line)}
.who{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:20px;padding:3px 12px 3px 3px}
.av{width:26px;height:26px;border-radius:50%;background:var(--navy-soft);color:var(--navy);
  display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.who .nm{font-size:12.5px;font-weight:600;line-height:1.15}
.who .rl{font-size:10.5px;color:var(--ink-3);line-height:1.15}
.who select{border:0;background:transparent;font:inherit;font-size:10.5px;color:var(--navy);
  outline:none;cursor:pointer;padding:0;font-weight:600}

/* ============ LAYOUT ============ */
.shell{display:flex;min-height:calc(100vh - var(--top) - 34px)}
.rail{width:var(--rail);flex:none;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;transition:width .16s ease;position:sticky;top:var(--top);
  height:calc(100vh - var(--top));overflow:hidden}
.rail.min{width:var(--rail-min)}
.rail-scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:10px 8px 14px}
.grp{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  padding:16px 10px 6px;font-weight:600;white-space:nowrap}
.rail.min .grp{opacity:0;height:14px;padding:6px 0 0}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;width:100%;
  background:transparent;border:0;text-align:left;color:var(--ink-2);font-size:13.5px;white-space:nowrap;position:relative}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:var(--navy-soft);color:var(--navy);font-weight:600}
.nav.on::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:3px;background:var(--navy);border-radius:0 2px 2px 0}
.nav svg{flex:none;width:17px;height:17px}
.nav .lb{overflow:hidden;text-overflow:ellipsis}
.rail.min .nav .lb,.rail.min .nav .bdg{display:none}
.rail.min .nav{justify-content:center;padding:9px 0}
.bdg{margin-left:auto;background:var(--crit);color:var(--surface);font-size:10px;font-weight:700;
  border-radius:9px;padding:1px 6px;min-width:18px;text-align:center}

.bdg.q{background:var(--ink-3)}
.rail-foot{border-top:1px solid var(--line);padding:8px}
.collapse{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:6px;
  background:transparent;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.collapse:hover{background:var(--surface-2);color:var(--ink)}
.rail.min .collapse{justify-content:center}
.rail.min .collapse span{display:none}

main{flex:1;min-width:0;padding:22px 26px 60px}
.page{max-width:1220px;margin:0 auto}
.crumb{font-size:11.5px;color:var(--ink-3);display:flex;gap:7px;align-items:center;margin-bottom:6px}
.crumb b{color:var(--ink-2);font-weight:500}
.ph1{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--ink-3);font-size:13px;margin:3px 0 0}
.acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:6px;font-size:13px;
  font-weight:500;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--surface)}

.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.btn.wa{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.btn.cr{border-color:var(--crit);color:var(--crit);background:var(--crit-soft)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn svg{width:15px;height:15px}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh-1)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-h h3{margin:0;font-size:14px;font-weight:600}
.card-h .r{margin-left:auto;display:flex;gap:7px;align-items:center}
.card-b{padding:16px}
.kpi{padding:15px 16px}
.kpi .l{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:"IBM Plex Mono",monospace;font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:7px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.kpi.a{border-left:3px solid var(--navy)} .kpi.b{border-left:3px solid var(--warn)}
.kpi.c{border-left:3px solid var(--ok)} .kpi.d2{border-left:3px solid var(--crit)}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th{text-align:left;font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.n{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
td.id{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--navy);font-weight:500;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:11px;font-size:11px;
  font-weight:600;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-wa{background:var(--warn-soft);color:var(--warn)}
.t-cr{background:var(--crit-soft);color:var(--crit)} .t-in{background:var(--info-soft);color:var(--info)}
.t-nv{background:var(--navy-soft);color:var(--navy)} .t-mu{background:var(--surface-3);color:var(--ink-3)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* stepper */
.steps{display:flex;gap:0;overflow-x:auto;padding:2px 0 10px}
.step{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 12px;background:var(--surface-2);
  border:1px solid var(--line);border-right:0;font-size:12px;color:var(--ink-3);white-space:nowrap;position:relative}
.step:first-child{border-radius:6px 0 0 6px}
.step:last-child{border-right:1px solid var(--line);border-radius:0 6px 6px 0}
.step .ic{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--surface-3);color:var(--ink-3);font-size:10px;font-weight:700}
.step.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.step.done .ic{background:var(--ok);color:var(--surface)}
.step.now{background:var(--navy-soft);color:var(--navy);border-color:transparent;font-weight:600}
.step.now .ic{background:var(--navy);color:var(--surface)}
.step.blk{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.step.blk .ic{background:var(--crit);color:var(--surface)}
.step[role="button"]{cursor:pointer}
.step[role="button"]:hover{filter:brightness(.97)}

/* form */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:5px}
.f.w2{grid-column:span 2}
.f label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.f label .req{color:var(--crit)}
.f input,.f select,.f textarea{border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:13px;outline:none;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px var(--navy-soft)}
.f .calc{background:var(--surface-2);color:var(--ink-2);border-style:dashed}
.f .hint{font-size:11px;color:var(--ink-3)}
.f .hint.bad{color:var(--crit)}
fieldset{border:0;padding:0;margin:0 0 22px}
legend{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--navy);
  padding:0 0 10px;width:100%;border-bottom:1px solid var(--line);margin-bottom:14px}

.verdict{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:8px;margin-top:6px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.wa{background:var(--warn-soft);color:var(--warn)}
.verdict.cr{background:var(--crit-soft);color:var(--crit)}
.verdict b{display:block;font-size:14px;margin-bottom:2px}
.verdict svg{width:19px;height:19px}
.verdict p{margin:0;font-size:12.5px;opacity:.9}

/* cashflow matrix */
.mtx{font-size:12px;min-width:900px}
.mtx th{position:sticky;top:0;z-index:2}
.mtx td:first-child,.mtx th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;
  border-right:1px solid var(--line);min-width:210px}
.mtx th:first-child{background:var(--surface-2);z-index:3}
.mtx td{text-align:right;font-family:"IBM Plex Mono",monospace;padding:6px 11px;font-variant-numeric:tabular-nums}
.mtx td:first-child{text-align:left;font-family:"Archivo",sans-serif}
.mtx tr.sec td{background:var(--surface-2);font-weight:700;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);font-family:"Archivo",sans-serif;text-align:left}
.mtx tr.tot td{font-weight:700;border-top:1px solid var(--line-2)}
.mtx .cell{cursor:pointer;border-radius:3px}
.mtx .cell:hover{background:var(--navy-soft);color:var(--navy)}
.mtx .neg{color:var(--crit)}
.wk-ok{background:var(--ok-soft);color:var(--ok)} .wk-wa{background:var(--warn-soft);color:var(--warn)}
.wk-cr{background:var(--crit-soft);color:var(--crit)}

/* perms matrix */
.perm td:first-child{text-align:left;font-weight:500}
.perm input[type=checkbox]{width:15px;height:15px;accent-color:var(--navy);cursor:pointer}
.perm td{text-align:center}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.42);opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,94vw);background:var(--paper);
  box-shadow:var(--sh-3);transform:translateX(102%);transition:transform .2s cubic-bezier(.4,0,.2,1);
  z-index:61;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;
  align-items:flex-start;gap:12px}
.dr-h h2{margin:0;font-size:17px;font-weight:700}
.dr-h .m{font-size:12px;color:var(--ink-3);margin-top:2px}
.dr-b{overflow-y:auto;padding:16px 18px 40px;flex:1}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 13px;font-size:13px;
  color:var(--ink-3);white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.dl{display:grid;grid-template-columns:minmax(120px,168px) 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:7px;overflow:hidden;font-size:13px}
.dl dt{background:var(--surface-2);padding:8px 12px;color:var(--ink-3);font-size:11.5px;font-weight:600}
.dl dd{background:var(--surface);padding:8px 12px;margin:0}
.tl{list-style:none;padding:0;margin:0}
.tl li{display:grid;grid-template-columns:112px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.tl time{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.tl b{font-weight:600}
.tl span{color:var(--ink-2)}

/* mobile phone */
.phone-wrap{position:fixed;inset:0;background:rgba(10,16,24,.66);display:none;place-items:center;z-index:70;padding:20px}
.phone-wrap.on{display:grid}
.phone{width:378px;max-width:100%;height:min(780px,92vh);background:var(--paper);border-radius:32px;
  border:9px solid #10161F;box-shadow:var(--sh-3);overflow:hidden;display:flex;flex-direction:column;position:relative}
.ph-top{background:var(--navy);color:var(--surface);padding:13px 16px 12px;flex:none}

.ph-top .r1{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;letter-spacing:.02em}
.ph-top .r2{display:flex;gap:14px;margin-top:11px;font-size:11px;opacity:.9}
.ph-top .r2 b{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;margin-top:1px}
.ph-body{flex:1;overflow-y:auto;padding:12px 12px 90px;display:flex;flex-direction:column;gap:10px}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 13px;box-shadow:var(--sh-1)}
.mc .r{display:flex;align-items:baseline;gap:8px}
.mc .who2{font-weight:600;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .vl{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px}
.mc .ln{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.mc .why{margin-top:9px;padding:7px 9px;border-radius:6px;font-size:11.5px;font-weight:600;display:flex;gap:7px;align-items:center}
.mc .why svg{width:14px;height:14px;flex:none}
.why.v-ok{background:var(--ok-soft);color:var(--ok)}
.why.v-wa{background:var(--warn-soft);color:var(--warn)}
.why.v-cr{background:var(--crit-soft);color:var(--crit)}
.why.v-mu{background:var(--surface-3);color:var(--ink-3)}
.mc .bt{display:flex;gap:7px;margin-top:10px}
.mc .bt button{flex:1;padding:8px;border-radius:7px;font-size:12.5px;font-weight:600;border:1px solid}
.ph-bar{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.ph-bar .cnt{font-size:11.5px;color:var(--ink-3);flex:1}
.ph-close{position:absolute;top:-4px;right:-4px}
.phone-x{position:fixed;top:22px;right:26px;z-index:71;background:var(--surface);border:1px solid var(--line-2);
  border-radius:20px;padding:7px 15px;font-size:13px;font-weight:600;box-shadow:var(--sh-2)}

/* misc */
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--navy);
  border-radius:0 7px 7px 0;padding:12px 15px;font-size:12.5px;color:var(--ink-2)}
.note b{color:var(--ink)}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.row-c{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);
  border-radius:7px;cursor:pointer;background:var(--surface)}
.row-c:hover{background:var(--surface-2);border-color:var(--line-2)}
.row-c .t{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-c .d{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
